services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      IHC_DB_PATH: /data/ihc.db
      IHC_COOKIE_SECURE: "1"
    volumes:
      - ihc_data:/data
    networks:
      - internal
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      EXAM_DOMAIN: ${EXAM_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - internal
volumes:
  ihc_data:
  caddy_data:
  caddy_config:
networks:
  internal:
